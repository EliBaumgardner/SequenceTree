name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build the test targets
        run: cmake --build build --target SequenceTree_Tests SequenceTree_GraphTests

      - name: Run the tests
        run: cd build && ctest --output-on-failure
